<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CrestEditor Mobile Editor</title>
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('crest_theme') || 'vs-dark';
        const isLight = theme === 'vs' || theme === 'vs-light' || theme === 'light-plus';
        const bg = isLight ? '#ffffff' : (theme === 'hc-black' ? '#000000' : '#1e1e1e');
        document.documentElement.style.backgroundColor = bg;
      } catch(_) {}
    })();
  </script>
  <style>
    html, body, #app, #editor-container {
      background-color: #1e1e1e;
      margin: 0;
      padding: 0;
    }
  </style>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head>
<body style="background-color: #1e1e1e; margin: 0;">
  <div id="app">
    <main id="editor-container">
      <div id="floating-toolbar">
        <button id="floating-copy" type="button">Copy</button>
        <button id="floating-paste" type="button">Paste</button>
      </div>
      <button id="start-handle" class="selection-handle" aria-label="Selection start"></button>
      <button id="end-handle" class="selection-handle" aria-label="Selection end"></button>
    </main>
  </div>

</body>
</html>
